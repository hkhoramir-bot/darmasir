<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سند چاپی — درمسیر</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    /* سازگاری با مسیر تمیز /admin/ و مستقیم با ?XTransformPort=3035 */
    (function () {
      var qp = new URLSearchParams(location.search).get("XTransformPort");
      var suffix = qp ? "?XTransformPort=" + encodeURIComponent(qp) : "";
      window.__ASSET_Q = suffix;
      document.write(
        '<style>' +
        '@font-face{font-family:"Vazirmatn";src:url("fonts/vazirmatn-arabic.woff2' + suffix + '") format("woff2");font-weight:400 800;font-display:swap;unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+FB50-FDFF;}' +
        '@font-face{font-family:"Vazirmatn";src:url("fonts/vazirmatn-latin.woff2' + suffix + '") format("woff2");font-weight:400 800;font-display:swap;}' +
        '<\/style>'
      );
    })();
  </script>
  <style>
    :root { --ink: #111c2d; --ink2: #4a5160; --ink3: #727782; --primary: #00417f; --primary-soft: #f0f3ff; --line: #c2c6d3; --tertiary: #006638; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: "Vazirmatn", Tahoma, sans-serif; color: var(--ink); background: #e9edf4; padding: 24px 12px; }
    .sheet {
      width: 210mm; max-width: 100%;
      min-height: 285mm;
      margin: 0 auto; background: #fff;
      padding: 14mm 13mm;
      box-shadow: 0 2px 18px rgba(15, 23, 42, 0.16);
      border-radius: 6px;
    }
    /* — سربرگ — */
    .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 3px solid var(--primary); padding-bottom: 14px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; flex: none; }
    .brand b { font-size: 19px; display: block; line-height: 1.4; }
    .brand span { font-size: 11px; color: var(--ink2); display: block; }
    .doc-title { text-align: left; }
    .doc-title h1 { margin: 0 0 6px; font-size: 20px; color: var(--primary); }
    .doc-title p { margin: 2px 0; font-size: 12px; color: var(--ink2); }
    .doc-title .stamp {
      display: inline-block; margin-top: 6px; padding: 3px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 800;
    }
    .stamp.ok { background: rgba(0, 102, 56, 0.1); color: var(--tertiary); border: 1px solid rgba(0, 102, 56, 0.3); }
    .stamp.warn { background: rgba(188, 0, 12, 0.06); color: #bc000c; border: 1px solid rgba(188, 0, 12, 0.25); }
    /* — متادیتا — */
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 28px; margin: 16px 0 6px; }
    .meta-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
    .meta-row span { color: var(--ink2); white-space: nowrap; }
    .meta-row b { font-weight: 700; text-align: left; }
    /* — جدول اقلام — */
    table.items { width: 100%; border-collapse: collapse; margin: 14px 0 4px; font-size: 12.5px; }
    table.items th { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--line); padding: 9px 10px; font-size: 12px; font-weight: 800; }
    table.items td { border: 1px solid var(--line); padding: 9px 10px; text-align: center; vertical-align: middle; }
    table.items td.r { text-align: right; }
    table.items tfoot td { background: #fafbff; font-weight: 700; }
    /* — جمع — */
    .totals { display: flex; justify-content: flex-start; margin-top: 12px; }
    .totals-box { width: 340px; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .totals-box .trow { display: flex; justify-content: space-between; gap: 16px; padding: 9px 14px; font-size: 13px; border-bottom: 1px solid #e3e7f0; }
    .totals-box .trow:last-child { border-bottom: none; background: var(--primary-soft); font-weight: 800; color: var(--primary); font-size: 14.5px; }
    .words { margin-top: 10px; font-size: 12px; background: #f7f9ff; border: 1px dashed var(--line); border-radius: 8px; padding: 9px 12px; line-height: 2; }
    .notes { margin-top: 10px; font-size: 12px; color: var(--ink2); line-height: 1.9; white-space: pre-wrap; }
    /* — کارت‌های خلاصه صورت‌حساب — */
    .sum-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 4px; }
    .sum-card { border: 1px solid var(--line); border-radius: 10px; padding: 13px 10px; text-align: center; }
    .sum-card b { display: block; font-size: 16px; color: var(--primary); margin-bottom: 3px; }
    .sum-card span { font-size: 11px; color: var(--ink2); }
    /* — امضاها — */
    .signs { display: flex; justify-content: space-between; gap: 40px; margin-top: 30mm; }
    .signs div { flex: 1; text-align: center; font-size: 12px; color: var(--ink2); border-top: 1.5px solid var(--ink3); padding-top: 8px; }
    .doc-foot { margin-top: 8mm; border-top: 1px solid var(--line); padding-top: 8px; font-size: 10px; color: var(--ink3); display: flex; justify-content: space-between; gap: 12px; }
    /* — نوار عملیات (چاپ نمی‌شود) — */
    .actions { max-width: 210mm; margin: 14px auto 0; display: flex; gap: 10px; justify-content: center; }
    .actions button {
      font-family: inherit; padding: 11px 24px; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 65, 127, 0.25);
    }
    .actions button.ghost { background: #fff; color: var(--primary); border: 1px solid var(--line); box-shadow: none; }
    .loading { text-align: center; padding: 60px 20px; color: var(--ink2); font-size: 14px; }
    .loading .material { font-size: 34px; display: block; margin-bottom: 10px; color: var(--primary); }
    @media (max-width: 740px) {
      .meta-grid { grid-template-columns: 1fr; }
      .sum-cards { grid-template-columns: 1fr; }
    }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; padding: 0; }
      .sheet { box-shadow: none; border-radius: 0; margin: 0; width: auto; min-height: auto; padding: 12mm 11mm; }
      .actions { display: none !important; }
      .signs { margin-top: 26mm; }
    }
  </style>
</head>
<body>
  <div class="sheet" id="sheet"><div class="loading">در حال آماده‌سازی سند…</div></div>
  <div class="actions">
    <button onclick="window.print()">چاپ / ذخیره PDF</button>
    <button class="ghost" onclick="window.close()">بستن پنجره</button>
  </div>
  <script src="print.js"></script>
</body>
</html>
