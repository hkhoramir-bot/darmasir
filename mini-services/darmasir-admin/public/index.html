<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>پنل مدیریت درمسیر</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    /* سازگاری با دو حالت دسترسی:
       ۱) مسیر تمیز /admin/ (دروازه)
       ۲) مستقیم با پارامتر ?XTransformPort=3035 */
    (function () {
      var qp = new URLSearchParams(location.search).get("XTransformPort");
      var suffix = qp ? "?XTransformPort=" + encodeURIComponent(qp) : "";
      window.__ASSET_Q = suffix;
      document.write('<link rel="stylesheet" href="style.css' + suffix + '" />');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='white' font-family='sans-serif'%3Eد%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-host" aria-live="polite"></div>
  <div id="modal-host"></div>
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "app.js" + (window.__ASSET_Q || "");
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
