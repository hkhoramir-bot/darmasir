<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>پنل مدیریت درمسیر</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    /* سازگاری با دو حالت دسترسی:
       ۱) مسیر تمیز /admin/ (دروازه)
       ۲) مستقیم با پارامتر ?XTransformPort=3035
       نکته: مسیر فونت‌ها باید پارامتر دروازه را همراه داشته باشند */
    (function () {
      var qp = new URLSearchParams(location.search).get("XTransformPort");
      var suffix = qp ? "?XTransformPort=" + encodeURIComponent(qp) : "";
      var P = location.pathname.indexOf("/admin") === 0 ? "/admin/" : "";
      window.__ASSET_Q = suffix;
      window.__ADMIN_P = P;
      document.write('<link rel="stylesheet" href="' + P + 'style.css' + suffix + '" />');
      document.write(
        '<style>' +
        '@font-face{font-family:"Vazirmatn";src:url("' + P + 'fonts/vazirmatn-arabic.woff2' + suffix + '") format("woff2");font-weight:400 800;font-display:swap;unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+FB50-FDFF;}' +
        '@font-face{font-family:"Vazirmatn";src:url("' + P + 'fonts/vazirmatn-latin.woff2' + suffix + '") format("woff2");font-weight:400 800;font-display:swap;}' +
        '@font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:100 700;font-display:block;src:url("' + P + 'fonts/material-symbols.woff2' + suffix + '") format("woff2");}' +
        '<\/style>'
      );
      document.write('<link rel="icon" type="image/svg+xml" href="' + P + 'metrojo-logo.svg' + suffix + '" />');
    })();
  </script>
  <meta name="theme-color" content="#07805f" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-host" aria-live="polite"></div>
  <div id="modal-host"></div>
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = (window.__ADMIN_P || "") + "app.js" + (window.__ASSET_Q || "");
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
